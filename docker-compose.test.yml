services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobagent_test
      POSTGRES_USER: jobagent_test
      POSTGRES_PASSWORD: jobagent_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent_test -d jobagent_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"
