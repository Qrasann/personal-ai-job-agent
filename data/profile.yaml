geography:
  current_country: RU
  target_countries: [GE, AM]
  remote_worldwide: true
  remote_regions: [EMEA]
  relocation_enabled: true
  relocation_countries: [GE, AM]

search:
  queries:
    - DevOps Engineer
    - Infrastructure Engineer
    - Linux Administrator
    - Site Reliability Engineer
  relocation_queries:
    - warehouse worker
    - production worker
    - hotel staff
    - kitchen assistant
    - cleaner
    - construction worker
    - customer support
  notify_min_score: 65
  modes:
    local_ru: true
    remote_international: true
    relocation: true
  minimum_salary_net_rub: 100000
  exclude_terms:
    - senior devops
    - lead devops
  employer_policy:
    categories:
      betting: allow
      casino_igaming: allow
      crypto_web3: warn
      civilian_state_owned: allow
      russian_military_defense: block
      verified_direct_war_tie: block
      russian_government_body: block
    # Exact employer identity only; ordinary state-owned civilian companies are not included.
    # Alabuga legal name/aliases: OFAC 2024-02-23, https://ofac.treasury.gov/recent-actions/20240223
    # Voentorg identity: OFAC 2025-01-15, https://ofac.treasury.gov/recent-actions/20250115
    # Voentorg armed-forces provision evidence: EU Decision 2022/883, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A32022D0883
    employers:
      "АО ОЭЗ ППТ АЛАБУГА": block
      "JOINT STOCK COMPANY SPECIAL ECONOMIC ZONE OF INDUSTRIAL PRODUCTION ALABUGA": block
      "AO OEZ PPT ALABUGA": block
      "Алабуга": block
      "Alabuga": block
      "АО ВОЕНТОРГ": block
      "JOINT STOCK COMPANY VOENTORG": block
      "AKTSIONERNOE OBSHCHESTVO VOENTORG": block
      "Военторг": block
      "Voentorg": block
  review_terms:
    - blockchain
    - crypto
    - web3
  senior_score_cap: 54
  high_experience_score_cap: 58
  stretch_score_cap: 72
  preferred_terms:
    - linux
    - docker
    - docker compose
    - nginx
    - git
    - bash
    - python
    - prometheus
    - grafana
    - ansible
    - terraform
    - kubernetes
  strong_terms:
    - linux
    - docker
    - nginx
    - bash
    - git

candidate:
  target_roles:
    - DevOps Engineer
    - Infrastructure Engineer
    - Linux Administrator
    - Site Reliability Engineer
  english: B1 # Current self-assessed general working English level.
  technical_reading_english: B2 # Historical technical-reading estimate only; not a speaking/interview score.
  hh_resume_id: null
  facts:
    - More than two years of system administration experience with Windows and Linux.
    - Practical Linux troubleshooting with systemd, journalctl, networking utilities, permissions and logs.
    - Practical Docker and Docker Compose experience in labs and personal projects.
    - Configured Nginx reverse proxy, volumes, internal container networks and health checks.
    - Bash scripting experience and basic Python.
    - Active Directory and VPN administration experience.
    - Prometheus and Grafana are being developed through study and lab practice.
    - Kubernetes, Terraform and Ansible are developing skills; do not claim production experience unless explicitly added later.
