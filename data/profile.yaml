geography:
  current_country: RU
  target_countries: [GE, AM]
  remote_worldwide: true
  remote_regions: [EMEA]
  relocation_enabled: true
  relocation_countries: [GE, AM]

search:
  queries:
    - DevOps Engineer
    - Infrastructure Engineer
    - Linux Administrator
  relocation_queries:
    - warehouse worker
    - production worker
    - hotel staff
    - kitchen assistant
    - cleaner
    - construction worker
    - customer support
  notify_min_score: 65
  modes:
    local_ru: true
    remote_international: true
    relocation: true
  minimum_salary_net_rub: 100000
  exclude_terms:
    - betting
    - gambling
    - букмекер
    - казино
    - crypto casino
    - senior devops
    - lead devops
  review_terms:
    - blockchain
    - crypto
    - web3
  senior_score_cap: 54
  high_experience_score_cap: 58
  stretch_score_cap: 72
  preferred_terms:
    - linux
    - docker
    - docker compose
    - nginx
    - git
    - bash
    - python
    - prometheus
    - grafana
    - ansible
    - terraform
    - kubernetes
  strong_terms:
    - linux
    - docker
    - nginx
    - bash
    - git

candidate:
  target_roles:
    - DevOps Engineer
    - Infrastructure Engineer
    - Linux Administrator
  english: B1 # Current self-assessed general working English level.
  technical_reading_english: B2 # Historical technical-reading estimate only; not a speaking/interview score.
  hh_resume_id: null
  facts:
    - More than two years of system administration experience with Windows and Linux.
    - Practical Linux troubleshooting with systemd, journalctl, networking utilities, permissions and logs.
    - Practical Docker and Docker Compose experience in labs and personal projects.
    - Configured Nginx reverse proxy, volumes, internal container networks and health checks.
    - Bash scripting experience and basic Python.
    - Active Directory and VPN administration experience.
    - Prometheus and Grafana are being developed through study and lab practice.
    - Kubernetes, Terraform and Ansible are developing skills; do not claim production experience unless explicitly added later.
