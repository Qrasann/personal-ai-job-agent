services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobagent_v3
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
    volumes:
      - jobagent_v3_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobagent -d jobagent_v3"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  app:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - jobagent_v3_files:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  jobagent_v3_pg:
  jobagent_v3_files:
