name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobagent_test
          POSTGRES_USER: jobagent_test
          POSTGRES_PASSWORD: jobagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent_test -d jobagent_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      JOB_AGENT_TEST_DATABASE_URL: postgresql+asyncpg://jobagent_test:jobagent_test@127.0.0.1:5432/jobagent_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m pytest -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        run: ./scripts/secret-scan.sh

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag personal-ai-job-agent:ci .
